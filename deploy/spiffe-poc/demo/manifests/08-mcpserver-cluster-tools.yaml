# SPDX-License-Identifier: Apache-2.0
# MCPServer for yardstick cluster-tools (kubectl-like operations).
#
# oidcConfig.resourceUrl is required by the operator when embeddedAuthServer is used
# (sets the AllowedAudiences for issued JWTs per RFC 8707).
#
# Stricter policy than fetch: only devops-agent can call tools.
# intern-agent can list tools but not call them.
# rogue-agent is blocked at the registration layer (wrong namespace).
---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: cluster-tools
  namespace: toolhive-system
spec:
  image: ghcr.io/stackloklabs/yardstick/yardstick-server:1.1.1
  transport: streamable-http
  oidcConfig:
    type: inline
    resourceUrl: "https://mcp-cluster-tools-proxy.toolhive-system.svc.cluster.local:8080"
    inline:
      issuer: "https://mcp-cluster-tools-proxy.toolhive-system.svc.cluster.local:8080"
      jwksAllowPrivateIP: true
      insecureAllowHTTP: false
      caBundleRef:
        configMapRef:
          name: spiffe-ca-bundle
          key: ca.crt
  externalAuthConfigRef:
    name: spiffe-auth-cluster-tools
  authzConfig:
    type: inline
    inline:
      policies:
        - |
          // Only devops-agent may call any cluster tool
          permit(
            principal,
            action == Action::"call_tool",
            resource
          )
          when {
            principal.claim_sub like "spiffe://toolhive.dev/ns/agents/sa/devops-*"
          };
        - |
          // agents namespace: all principals may list tools (read-only discovery)
          permit(
            principal,
            action == Action::"list_tools",
            resource
          )
          when {
            principal.claim_sub like "spiffe://toolhive.dev/ns/agents/*"
          };
