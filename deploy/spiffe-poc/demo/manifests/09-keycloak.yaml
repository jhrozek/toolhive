# SPDX-License-Identifier: Apache-2.0
# Keycloak deployment with TLS for the SPIFFE delegation demo.
#
# Uses a DEDICATED self-signed CA for Keycloak (NOT the SPIFFE CA).
# The SPIFFE CA is for workload identity (mTLS between agents and servers).
# Keycloak's CA is for service TLS — a separate trust domain, just like
# a public or corporate CA would be in production.
#
# The Keycloak CA cert is distributed to auth server pods via ConfigMap
# (keycloak-ca-bundle in toolhive-system) so the token exchange validator
# can verify Keycloak's OIDC discovery and JWKS endpoints.
#
# Prerequisites:
#   - Keycloak operator installed (task keycloak:install-operator)
#   - cert-manager deployed (deploy/spiffe-poc/setup.sh)
#   - keycloak namespace exists (created by keycloak operator install)
#
# After applying:
#   - Keycloak available at https://keycloak-dev-service.keycloak.svc.cluster.local:8443
#   - OIDC discovery: https://keycloak-dev-service.keycloak.svc.cluster.local:8443/realms/toolhive/.well-known/openid-configuration
#   - Keycloak CA cert in Secret keycloak-ca-secret (key: ca.crt)
---
# Approval policy for the self-signed Keycloak CA certificate.
# Required by approver-policy which is deployed in the SPIFFE PoC.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: allow-keycloak-ca
spec:
  allowed:
    commonName:
      value: "Keycloak Dev CA"
    isCA: true
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: keycloak-selfsigned-issuer
---
# Approval policy for Keycloak server certs issued by the Keycloak CA.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: allow-keycloak-server-certs
spec:
  allowed:
    dnsNames:
      values:
        - "keycloak-dev-service*"
        - "*.keycloak.svc*"
    usages:
      - server auth
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: keycloak-ca-issuer
---
# Self-signed bootstrap issuer for the Keycloak CA.
# This is completely separate from the SPIFFE CA infrastructure.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: keycloak-selfsigned-issuer
spec:
  selfSigned: {}
---
# Root CA certificate for Keycloak TLS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-ca
  namespace: keycloak
spec:
  isCA: true
  secretName: keycloak-ca-secret
  commonName: Keycloak Dev CA
  duration: 87600h   # 10 years
  renewBefore: 8760h # renew 1 year before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: keycloak-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# Issuer backed by the Keycloak CA.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: keycloak-ca-issuer
  namespace: keycloak
spec:
  ca:
    secretName: keycloak-ca-secret
---
# Keycloak server TLS certificate, signed by the Keycloak CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
spec:
  secretName: keycloak-tls-secret
  duration: 8760h    # 1 year
  renewBefore: 720h  # renew 30 days before expiry
  dnsNames:
    - keycloak-dev-service
    - keycloak-dev-service.keycloak.svc
    - keycloak-dev-service.keycloak.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
  issuerRef:
    name: keycloak-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
# Keycloak instance with TLS passthrough.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak-dev
  namespace: keycloak
spec:
  instances: 1
  startOptimized: false
  hostname:
    hostname: keycloak-dev-service.keycloak.svc.cluster.local
  http:
    tlsSecret: keycloak-tls-secret
  db:
    vendor: dev-file
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  additionalOptions:
    - name: health-enabled
      value: "true"
    - name: log-level
      value: INFO
