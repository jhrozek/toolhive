# SPDX-License-Identifier: Apache-2.0
# MCPExternalAuthConfig for the fetch MCP server.
#
# How it works:
#   1. The proxy listener serves TLS using the cert-manager-issued server cert.
#   2. Clients (agent pods) present their SPIFFE SVID as a TLS client certificate.
#   3. The embedded auth server validates the SPIFFE ID against spiffeClientPolicy
#      and issues a short-lived JWT via client_credentials grant.
#   4. Cedar policies evaluate the SPIFFE ID (JWT sub claim) for tool authorization.
#
# No upstreamProviders are needed: SPIFFE mTLS is the only auth path.
# The embedded auth server issues tokens directly — no external IdP.
---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPExternalAuthConfig
metadata:
  name: spiffe-auth-fetch
  namespace: toolhive-system
spec:
  type: embeddedAuthServer
  embeddedAuthServer:
    issuer: "https://mcp-fetch-proxy.toolhive-system.svc.cluster.local:8080"
    spiffeTrustDomain: "toolhive.dev"
    spiffeClientPolicy:
      allowedIdentities:
        - namespace: agents
          serviceAccount: "*"
      maxRegistrations: 50
    tls:
      certSecretRef:
        name: fetch-tls-secret
        key: tls.crt
      keySecretRef:
        name: fetch-tls-secret
        key: tls.key
      clientCASecretRef:
        name: fetch-tls-secret
        key: ca.crt
    upstreamProviders: []
