# SPDX-License-Identifier: Apache-2.0
# Service accounts for demo agent pods.
# SPIFFE IDs are derived from the namespace and service account name:
#   spiffe://toolhive.dev/ns/<namespace>/sa/<service-account>
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-agent
  namespace: agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intern-agent
  namespace: agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rogue-agent
  namespace: untrusted
