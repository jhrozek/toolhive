# SPDX-License-Identifier: Apache-2.0
# MCPExternalAuthConfig for the cluster-tools MCP server.
#
# How it works:
#   1. The proxy listener serves TLS using the cert-manager-issued server cert.
#   2. Clients (agent pods) present their SPIFFE SVID as a TLS client certificate.
#   3. The embedded auth server validates the SPIFFE ID against spiffeClientPolicy
#      and issues a short-lived JWT via client_credentials grant.
#   4. Cedar policies evaluate the SPIFFE ID (JWT sub claim) for tool authorization.
#
# The oidc-trust upstream provides JWKS trust for Keycloak token validation
# during RFC 8693 token exchange (same as 05-auth-config-fetch.yaml).
---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPExternalAuthConfig
metadata:
  name: spiffe-auth-cluster-tools
  namespace: toolhive-system
spec:
  type: embeddedAuthServer
  embeddedAuthServer:
    issuer: "https://mcp-cluster-tools-proxy.toolhive-system.svc.cluster.local:8080"
    spiffeTrustDomain: "toolhive.dev"
    spiffeClientPolicy:
      allowedIdentities:
        - namespace: agents
          serviceAccount: "*"
      maxRegistrations: 50
    tls:
      certSecretRef:
        name: cluster-tools-tls-secret
        key: tls.crt
      keySecretRef:
        name: cluster-tools-tls-secret
        key: tls.key
      clientCASecretRef:
        name: cluster-tools-tls-secret
        key: ca.crt
    upstreamProviders:
      - name: keycloak
        type: oidc-trust
        oidcConfig:
          issuerUrl: "https://keycloak-dev-service.keycloak.svc.cluster.local:8443/realms/toolhive"
          clientId: "mcp-test-client"
          allowPrivateIP: true  # Required: Keycloak service resolves to cluster-internal IP
          caBundleConfigMapRef:
            configMapRef:
              name: keycloak-ca-bundle
              key: ca.crt
