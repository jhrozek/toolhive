# SPDX-License-Identifier: Apache-2.0
# MCPServer for the gofetch server (fetch arbitrary URLs).
#
# oidcConfig.resourceUrl is required by the operator when embeddedAuthServer is used
# (sets the AllowedAudiences for issued JWTs per RFC 8707).
# It matches the HTTPS URL clients use to reach this MCP server proxy.
#
# Cedar authorization policy:
#   - devops-agent: can call ANY tool and list tools
#   - intern-agent: can call fetch tool and list tools
#   - rogue-agent (untrusted ns): denied at registration; never gets a JWT
#
# The SPIFFE ID injected as claim_sub has the form:
#   spiffe://toolhive.dev/ns/<namespace>/sa/<service-account>
---
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: fetch
  namespace: toolhive-system
spec:
  image: ghcr.io/stackloklabs/gofetch/server:1.0.1
  transport: streamable-http
  resourceOverrides:
    proxyDeployment:
      env:
        - name: TOOLHIVE_DEBUG
          value: "true"
  oidcConfig:
    type: inline
    resourceUrl: "https://mcp-fetch-proxy.toolhive-system.svc.cluster.local:8080"
    inline:
      issuer: "https://mcp-fetch-proxy.toolhive-system.svc.cluster.local:8080"
      jwksAllowPrivateIP: true
      insecureAllowHTTP: false
      caBundleRef:
        configMapRef:
          name: spiffe-ca-bundle
          key: ca.crt
  externalAuthConfigRef:
    name: spiffe-auth-fetch
  authzConfig:
    type: inline
    inline:
      policies:
        - |
          // devops-agent: full access to all tools
          permit(
            principal,
            action == Action::"call_tool",
            resource
          )
          when {
            principal.claim_sub like "spiffe://toolhive.dev/ns/agents/sa/devops-*"
          };
        - |
          // intern-agent: can call the fetch tool
          permit(
            principal,
            action == Action::"call_tool",
            resource == Tool::"fetch"
          )
          when {
            principal.claim_sub like "spiffe://toolhive.dev/ns/agents/sa/intern-*"
          };
        - |
          // agents namespace: all principals may list tools
          permit(
            principal,
            action == Action::"list_tools",
            resource
          )
          when {
            principal.claim_sub like "spiffe://toolhive.dev/ns/agents/*"
          };
        - |
          // Delegation: devops-user can access all tools via any trusted agent.
          // Keycloak sub is a UUID; match on email instead for human-readable policies.
          // act.sub is the agent's SPIFFE ID from the actor_token.
          permit(
            principal,
            action == Action::"call_tool",
            resource
          )
          when {
            context has claim_act &&
            context has claim_email &&
            context.claim_email == "devops-user@example.com" &&
            context.claim_act.sub like "spiffe://toolhive.dev/ns/agents/sa/*"
          };
        - |
          // Delegation: all delegated identities may list tools
          permit(
            principal,
            action == Action::"list_tools",
            resource
          )
          when { context has claim_act };
