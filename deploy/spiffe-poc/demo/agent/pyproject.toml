[project]
name = "spiffe-mcp-agent"
version = "0.1.0"
description = "SPIFFE-authenticated pydantic-ai agent for ToolHive MCP servers"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai[openai,anthropic]>=0.0.49",
    "httpx>=0.27",
    "pydantic>=2.0",
    "cryptography>=44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spiffe_agent"]
